<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Crevo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="components/navbar.js" defer></script>
    <script src="components/footer.js" defer></script>
</head>
<body class="font-poppins">
    <custom-navbar></custom-navbar>

    <main class="pt-[60px] sm:pt-[70px] md:pt-[80px]">
        <section class="min-h-[80vh] flex items-center justify-center bg-gradient-to-br from-[#0B2A4A] to-[#1E3A8A]">
            <div class="text-center px-4">
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 sm:p-12 max-w-2xl mx-auto">
                    <div class="mb-6 flex justify-center">
                        <div class="bg-green-100 p-3 rounded-full">
                            <i data-feather="check" class="w-12 h-12 text-green-500"></i>
                        </div>
                    </div>
                    <h1 class="text-3xl sm:text-4xl font-bold text-white mb-4">Thank You!</h1>
                    <p class="text-blue-100 text-lg mb-8">
                        Your message has been sent successfully. We'll get back to you as soon as possible.
                    </p>
                    <a href="index.html" class="inline-flex items-center gap-2 bg-[#3B6AFB] hover:bg-blue-600 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300">
                        <i data-feather="home" class="w-5 h-5"></i>
                        Back to Home
                    </a>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>
    <script>feather.replace();</script>
</body>
</html>
