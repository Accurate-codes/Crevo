<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Crevo - Tech Education & Software Development</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="font-poppins">
    <custom-navbar></custom-navbar>

    <main class="py-20 px-4">
        <section class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-bold text-[#0B2A4A] mb-4 text-center">Contact Us</h1>
            <p class="text-gray-600 text-center max-w-2xl mx-auto mb-12">
                Have questions about our programs or services? Want to discuss a potential project? Reach out to us—we'd love to hear from you!
            </p>

            <div class="grid md:grid-cols-2 gap-12">
                <div class="bg-white p-8 rounded-xl shadow-sm">
                    <form action="https://formsubmit.co/webcompany106@gmail.com" method="POST" class="space-y-6">
                        <!-- FormSubmit Configuration -->
                        <input type="hidden" name="_subject" value="New Contact Form Submission">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="thank-you.html">
                        <!-- Honeypot to prevent spam -->
                        <input type="text" name="_honey" style="display:none">
                        
                        <div class="mb-6">
                            <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
                            <input type="text" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#3B6AFB] focus:border-transparent">
                        </div>
                        <div class="mb-6">
                            <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
                            <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#3B6AFB] focus:border-transparent">
                        </div>
                        <div class="mb-6">
                            <label for="message" class="block text-gray-700 font-medium mb-2">Message</label>
                            <textarea name="message" rows="5" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#3B6AFB] focus:border-transparent"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-[#3B6AFB] hover:bg-blue-600 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2">
                            <i data-feather="send" class="w-5 h-5"></i>
                            Send Message
                        </button>
                    </form>
                </div>

                <div>
                    <div class="bg-[#F8FAFC] p-8 rounded-xl mb-8">
                        <h2 class="text-xl font-semibold text-[#0B2A4A] mb-4">Contact Information</h2>
                        <div class="space-y-4">
                            <div class="flex items-start">
                                <i data-feather="mail" class="text-[#3B6AFB] w-5 h-5 mt-1 mr-3"></i>
                                <div>
                                    <p class="text-gray-600">Email us at</p>
                                    <a href="mailto:webcompany106@gmail.com" class="text-[#0B2A4A] font-medium hover:text-[#3B6AFB]">webcompany106@gmail.com</a>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <i data-feather="phone" class="text-[#3B6AFB] w-5 h-5 mt-1 mr-3"></i>
                                <div>
                                    <p class="text-gray-600">Call us at</p>
                                    <a href="tel:+2349126406218" class="text-[#0B2A4A] font-medium hover:text-[#3B6AFB]">+2349126406218</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#F8FAFC] p-8 rounded-xl">
                        COMMING SOON: Map or additional info can go here.
                    </div>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>
    <script>
        feather.replace();
    </script>
</body>
</html>
